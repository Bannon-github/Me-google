name: Self-Improvement Reflection

on:
  # Run every Monday at 06:00 UTC (weekly retrospective)
  schedule:
    - cron: '0 6 * * 1'

  # Also run whenever tasks or source code changes (incremental improvement)
  push:
    branches: [main]
    paths:
      - 'TASKS.md'
      - '.task-state.json'
      - 'core/**'
      - 'services/**'
      - 'scripts/**'
      - 'platform/**'

  # Allow manual trigger for on-demand reflection
  workflow_dispatch:
    inputs:
      days:
        description: 'Git history window in days'
        required: false
        default: '30'
      open_pr:
        description: 'Open a PR with derived rules/skills if changed'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  reflect:
    name: Analyse · Derive Rules & Skills · Inject
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full reflection pipeline
        id: reflect
        run: |
          python3 scripts/reflect.py run-all
          echo "report_path=reports/reflection-$(date +%F).md" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "me-google-reflect[bot]"
          git config user.email "reflect-bot@me-google.internal"

      # ── Option A: direct commit to main (for scheduled runs) ──────────────
      - name: Commit reflection artefacts (scheduled)
        if: >
          steps.changes.outputs.changed == 'true' &&
          github.event_name == 'schedule'
        run: |
          git commit -m "chore(reflect): weekly self-improvement reflection $(date +%F)"
          git push

      # ── Option B: open a PR (for push / workflow_dispatch) ────────────────
      - name: Create reflection branch and PR
        if: >
          steps.changes.outputs.changed == 'true' &&
          github.event_name != 'schedule' &&
          (github.event.inputs.open_pr != 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/reflect-$(date +%F-%H%M)"
          git checkout -b "$BRANCH"
          git commit -m "chore(reflect): auto-derived rules and skills $(date +%F)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(reflect): self-improvement update $(date +%F)" \
            --body "## Automated Self-Improvement Reflection

          This PR was opened automatically by the \`reflect.py\` pipeline.

          ### Changes
          - Updated \`.github/rules/derived/\` with newly derived rules
          - Updated \`.github/skills/derived/\` with newly derived skills
          - Updated \`.github/rules/registry.json\` and \`.github/skills/registry.json\`
          - Injected high-severity rules into \`.github/copilot-instructions.md\`
          - Generated reflection report in \`reports/\`

          ### Review Instructions
          1. Open \`reports/reflection-$(date +%F).md\` for the full findings report.
          2. Check the injected rules in \`.github/copilot-instructions.md\`.
          3. Review any \`required\` rules for correctness before merging.
          4. Merge if the derived guidance looks accurate; reject or amend rules that are wrong.

          > **This PR was generated by \`scripts/reflect.py\`.** Do not edit the derived files
          > directly — edit the reflection engine instead.
          " \
            --base main \
            --head "$BRANCH"

      - name: Upload reflection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-report-${{ github.run_id }}
          path: reports/reflection-*.md
          retention-days: 90

      - name: Print summary
        if: always()
        run: |
          echo "### Reflection Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${{ steps.reflect.outputs.report_path }}" ]; then
            head -40 "${{ steps.reflect.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi
