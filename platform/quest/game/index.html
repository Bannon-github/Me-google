<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E16" />
    <!-- Instruct the Meta Quest Browser to allow immersive-vr sessions -->
    <meta name="xr-spatial-tracking" content="true" />
    <title>Orb Collector — Me-google xrOS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #05070B;
        color: #E8EAF0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
      }

      #app-title {
        font-size: clamp(1.4rem, 5vw, 2.2rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #7B5CFF;
      }

      #app-subtitle {
        font-size: clamp(0.85rem, 2.5vw, 1.05rem);
        color: #8B9BC0;
        text-align: center;
        max-width: 34ch;
        line-height: 1.6;
      }

      /* Three.js canvas fills the whole viewport once injected */
      canvas {
        position: fixed !important;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
      }

      /* VRButton injected by Three.js — keep its z-order above canvas */
      #VRButton {
        z-index: 10 !important;
      }
    </style>
  </head>
  <body>
    <div id="app-title">Orb Collector</div>
    <div id="app-subtitle">
      Put on your Quest 3 headset, press <strong>Enter VR</strong>, then aim and
      trigger to pop floating orbs. 60 seconds. How high can you score?
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
